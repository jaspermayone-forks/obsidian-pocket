name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Attest main.js
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest@v4
        with:
          subject-path: styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes
            - Sync conversations into Drive-style folders with transcript, summary, action item, and mind map files.
            - Sync Pocket insights as single notes under the Insights folder.
            - Add rate-limit-aware public API syncing and GitHub artifact attestations for release assets.

            ## Obsidian review
            - Raises the minimum Obsidian app version to match the APIs used by the settings UI.
          files: |
            main.js
            manifest.json
            styles.css
